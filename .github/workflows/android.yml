name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Web-Oberfläche in die App kopieren
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleinanzeigen-inserieren.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kleinanzeigen-inserieren
          path: Kleinanzeigen-inserieren.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Kleinanzeigen-App (Build ${{ github.run_number }})
          body: |
            APK zum Installieren auf dem Handy.
            Direktlink zur neuesten Version:
            https://github.com/${{ github.repository }}/releases/latest/download/Kleinanzeigen-inserieren.apk
          files: Kleinanzeigen-inserieren.apk
          make_latest: true
