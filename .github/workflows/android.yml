name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK vorbereiten
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          MGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$MGR" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/tools.zip -d /tmp/tools
            mv /tmp/tools/cmdline-tools "$SDK/cmdline-tools/latest"
            MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$MGR" --sdk_root="$SDK" --licenses > /dev/null || true
          "$MGR" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /tmp/sdk.log 2>&1 \
            || { echo "::error title=SDK::$(tail -c 600 /tmp/sdk.log | tr '\n' ' ')"; exit 1; }

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Web-Oberfläche in die App kopieren
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK bauen
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee /tmp/build.log || {
            grep -E "error:|e: |What went wrong|Could not|FAILED|> " /tmp/build.log | head -25 | while IFS= read -r z; do echo "::error title=Build::$z"; done
            exit 1; }

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleinanzeigen-inserieren.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Kleinanzeigen-inserieren
          path: Kleinanzeigen-inserieren.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Kleinanzeigen-App (Build ${{ github.run_number }})
          body: |
            APK zum Installieren auf dem Handy.
            Direktlink zur neuesten Version:
            https://github.com/${{ github.repository }}/releases/latest/download/Kleinanzeigen-inserieren.apk
          files: Kleinanzeigen-inserieren.apk
          make_latest: true
