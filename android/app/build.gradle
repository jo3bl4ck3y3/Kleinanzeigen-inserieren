plugins {
    id 'com.android.application'
}

def buildNr = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'de.buender.kleinanzeigen'
    compileSdk 34

    defaultConfig {
        applicationId 'de.buender.kleinanzeigen'
        minSdk 29
        targetSdk 34
        versionCode buildNr
        versionName "1.3." + buildNr
    }

    signingConfigs {
        // Fester Schlüssel, damit sich neue Versionen über die alte installieren lassen
        fest {
            storeFile file('signatur.keystore')
            storePassword 'kleinanzeigen'
            keyAlias 'kleinanzeigen'
            keyPassword 'kleinanzeigen'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
